<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a45ffa" stop-opacity="0.14"/>
      <stop offset="28%" stop-color="#0a192f" stop-opacity="0"/>
      <stop offset="72%" stop-color="#0a192f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#66ffdb" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a45ffa"/>
      <stop offset="100%" stop-color="#66ffdb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a192f"/>
  <rect width="1200" height="630" fill="url(#wash)"/>

  <rect x="96" y="168" width="96" height="96" rx="18" fill="#071222"/>
  <rect x="96" y="168" width="96" height="96" rx="18" fill="none" stroke="url(#mark)" stroke-width="3"/>
  <text x="144" y="242" text-anchor="middle"
        font-family="ui-monospace, 'Noto Sans Mono', monospace"
        font-size="78" font-weight="900" fill="#a45ffa">U</text>

  <text x="224" y="232"
        font-family="'Noto Sans', Lato, system-ui, sans-serif"
        font-size="72" font-weight="700" fill="#f4f7fb"
        letter-spacing="-1.5">UBLX &amp; Co</text>

  <text x="96" y="340"
        font-family="'Noto Sans', Lato, system-ui, sans-serif"
        font-size="36" font-weight="500" fill="#c9d4e3">
    Index once. Enrich on demand. Browse in the terminal.
  </text>

  <text x="96" y="410"
        font-family="'Noto Sans', Lato, system-ui, sans-serif"
        font-size="26" font-weight="400" fill="#8b9bb0">
