  </text>

  <g font-family="'Noto Sans', Lato, system-ui, sans-serif" font-size="24" font-weight="600">
    <text x="96" y="520" fill="#66ffdb">UBLX</text>
    <text x="196" y="520" fill="#5a6a80">/</text>
    <text x="224" y="520" fill="#a45ffa">Nefaxer</text>
    <text x="348" y="520" fill="#5a6a80">/</text>
    <text x="376" y="520" fill="#66ffdb">ZahirScan</text>
  </g>

  <text x="1104" y="520" text-anchor="end"
        font-family="'Noto Sans', Lato, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#5a6a80">ublx.dev</text>
